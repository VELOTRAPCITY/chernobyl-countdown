<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☢️ Chernobyl Countdown ☢️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    color:gray;
    position:relative;
}

/* Animated radioactive background */

body::before{
    content:"";
    position:absolute;
    width:300%;
    height:300%;
    background:
    radial-gradient(circle,
    rgba(255,255,255,0.04) 0%,
    rgba(0,0,0,1) 70%);
    animation:rotateBG 20s linear infinite;
}

@keyframes rotateBG{
    0%{
        transform:rotate(0deg) scale(1);
    }

    50%{
        transform:rotate(180deg) scale(1.1);
    }

    100%{
        transform:rotate(360deg) scale(1);
    }
}

/* Floating symbols */

.symbols{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:0;
}

.symbols span{
    position:absolute;
    display:block;
    color:rgba(255,255,255,0.05);
    font-size:40px;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    0%{
        transform:translateY(100vh) rotate(0deg);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    background:rgba(20,20,20,0.65);
    padding:40px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    box-shadow:
    0 0 25px rgba(255,255,255,0.08),
    0 0 60px rgba(255,255,255,0.04);
}

/* Title */

h1{
    font-size:2.5rem;
    margin-bottom:35px;
    color:#b0b0b0;
    text-shadow:
    0 0 10px rgba(255,255,255,0.2),
    0 0 30px rgba(255,255,255,0.08);
    animation:flicker 2s infinite;
}

@keyframes flicker{
    0%,18%,22%,25%,53%,57%,100%{
        opacity:1;
    }

    20%,24%,55%{
        opacity:0.5;
    }
}

/* Countdown boxes */

.countdown{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.box{
    width:140px;
    height:140px;
    background:rgba(35,35,35,0.8);
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
    0 0 15px rgba(255,255,255,0.06);
    animation:pulse 3s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }
}

.number{
    font-size:3rem;
    font-weight:bold;
    color:#d0d0d0;
    text-shadow:0 0 15px rgba(255,255,255,0.15);
}

.label{
    margin-top:10px;
    font-size:1rem;
    letter-spacing:2px;
    color:#8c8c8c;
}

/* Footer */

.footer{
    margin-top:25px;
    color:#777;
    font-size:1rem;
    animation:flicker 3s infinite;
}

@media(max-width:800px){

    h1{
        font-size:1.5rem;
    }

    .box{
        width:100px;
        height:100px;
    }

    .number{
        font-size:2rem;
    }
}

</style>
</head>
<body>

<!-- Music -->

<audio id="bgMusic" loop autoplay>
    <source src="Theme.mp3" type="audio/mpeg">
</audio>

<!-- Floating symbols -->

<div class="symbols">
    <span style="left:5%; animation-duration:14s;">☢️</span>
    <span style="left:15%; animation-duration:18s;">☣️</span>
    <span style="left:25%; animation-duration:20s;">⚠️</span>
    <span style="left:40%; animation-duration:16s;">☢️</span>
    <span style="left:55%; animation-duration:22s;">☣️</span>
    <span style="left:70%; animation-duration:19s;">⚠️</span>
    <span style="left:85%; animation-duration:15s;">☢️</span>
</div>

<!-- Main container -->

<div class="container">

    <h1>☢️ A Normal House 2 Chernobyl Radioactive Update ☢️</h1>

    <div class="countdown">

        <div class="box">
            <div class="number" id="days">7</div>
            <div class="label">🌑 DAYS</div>
        </div>

        <div class="box">
            <div class="number" id="hours">2</div>
            <div class="label">⏳ HOURS</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">3</div>
            <div class="label">⚠️ MINUTES</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">2</div>
            <div class="label">☣️ SECONDS</div>
        </div>

    </div>

    <div class="footer">
        🧪 Radiation Levels Rising...
    </div>

</div>

<script>

/* Start music on first click if browser blocks autoplay */

const music = document.getElementById("bgMusic");

document.addEventListener("click", () => {
    music.play();
}, { once:true });

/* Countdown time */

const totalDuration =
((((7 * 24) + 2) * 60 * 60) + (3 * 60) + 2) * 1000;

/* Never reset */

let targetTime = localStorage.getItem("chernobylCountdown");

if(!targetTime){

    targetTime = Date.now() + totalDuration;

    localStorage.setItem(
        "chernobylCountdown",
        targetTime
    );
}

targetTime = parseInt(targetTime);

function updateCountdown(){

    const now = Date.now();

    let distance = targetTime - now;

    if(distance < 0){
        distance = 0;
    }

    const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (distance / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (distance / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (distance / 1000) % 60
    );

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
